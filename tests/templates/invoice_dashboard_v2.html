<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCR level 2 report</title>
<style>
:root{color-scheme:light;--ink:#172b2a;--muted:#667774;--line:#dce4df;--bg:#f4f6f2;--paper:#fff;--green:#20614b;--red:#a8423a;--amber:#8c621d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px}h1,h2,p{margin:0}h1{font-size:30px}.sub{color:var(--muted);margin-top:7px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px}.card{padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:700;margin:3px 0}.note{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px}.panel{overflow:hidden;margin-bottom:16px}.panel h2{font-size:16px;padding:15px 17px;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #edf0ed;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#fafbf9}.ok{color:var(--green);font-weight:650}.bad{color:var(--red);font-weight:650}.warn{color:var(--amber);font-weight:650}.empty{color:var(--muted);font-style:italic}.records{display:grid;gap:10px;padding:12px}.record{border:1px solid var(--line);border-radius:9px;overflow:hidden}.record summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:12px;background:#fafbf9}.record-meta{color:var(--muted);font-size:11px;margin-top:3px}.record-body{padding:12px 14px}.error{color:var(--red);background:#fff2ef;padding:9px;border-radius:6px;margin-bottom:10px}.exports{display:flex;gap:8px;margin-top:13px}.exports a{color:var(--green)}.placeholder{padding:28px;color:var(--muted)}@media(max-width:900px){.metrics,.layout{grid-template-columns:1fr 1fr}}@media(max-width:600px){main{padding:18px}.metrics,.layout{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<header><h1>OCR level 2</h1><p class="sub" id="subtitle"></p><div class="exports"><a href="run.json">JSON</a><a href="results.csv">Results CSV</a><a href="fields.csv">Fields CSV</a></div></header>
<section class="metrics" id="metrics"></section>
<div class="layout"><div><section class="panel"><h2>Classification matrix</h2><div id="matrix"></div></section><section class="panel"><h2>Field accuracy</h2><div id="fields"></div></section><section class="panel"><h2>Diagnostic segments</h2><div id="types"></div></section></div><section class="panel"><h2>Documents</h2><div id="records"></div></section></div>
</main><script>
const data=__REPORT_DATA__;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=value=>value==null?'n/a':`${(100*value).toFixed(2)}%`;
const value=value=>value==null||value===''?'<span class="empty">Empty</span>':esc(value);
const summary=data.summary;
document.getElementById('subtitle').textContent=`${data.scope} · ${data.extractor.split('.').pop()} · ${data.status} · ${data.records.length}/${data.documents_total} documents`;
if(!summary){document.getElementById('metrics').innerHTML='<div class="card"><div class="value">Ready</div><div class="note">No documents have finished yet.</div></div>';document.getElementById('records').innerHTML='<p class="placeholder">Results will appear after the first document.</p>';}else{
 const c=summary.classification,e=summary.extraction;
 document.getElementById('metrics').innerHTML=`<div class="card"><div class="label">Classification</div><div class="value">${pct(c.accuracy)}</div><div class="note">${c.matched}/${c.total} · ${summary.review_documents} review excluded</div></div><div class="card"><div class="label">Balanced accuracy</div><div class="value">${pct(c.balanced_accuracy)}</div><div class="note">Macro F1 ${pct(c.macro_f1)}</div></div><div class="card"><div class="label">Field extraction</div><div class="value">${pct(e.accuracy)}</div><div class="note">${e.matched}/${e.total} annotated fields</div></div><div class="card"><div class="label">Ground-truth coverage</div><div class="value">${pct(e.coverage)}</div><div class="note">${e.ignored_unannotated} unannotated cells ignored</div></div>`;
 const matrix=c.confusion_matrix;document.getElementById('matrix').innerHTML=`<table><thead><tr><th>Expected</th><th>Valid</th><th>Invalid</th><th>Missing</th></tr></thead><tbody>${['valid','invalid'].map(expected=>`<tr><td>${expected}</td><td>${matrix[expected].valid}</td><td>${matrix[expected].invalid}</td><td>${matrix[expected].missing}</td></tr>`).join('')}</tbody></table><p class="record-body"><span class="bad">${c.false_valid} false valid</span> · <span class="warn">${c.false_invalid} false invalid</span></p>`;
 document.getElementById('fields').innerHTML=`<table><thead><tr><th>Field</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${Object.values(e.by_field).map(field=>`<tr><td>${esc(field.label)}</td><td>${field.matched}/${field.total}</td><td>${pct(field.accuracy)}</td></tr>`).join('')}</tbody></table>`;
 document.getElementById('types').innerHTML=`<table><thead><tr><th>Type</th><th>Docs</th><th>Class.</th><th>Fields</th></tr></thead><tbody>${Object.entries(summary.by_diagnostic_type).map(([name,item])=>`<tr><td>${esc(name)}</td><td>${item.documents}</td><td>${item.classification_matched}/${item.classification_total}</td><td>${item.extraction_matched}/${item.extraction_total}</td></tr>`).join('')}</tbody></table>`;
 document.getElementById('records').innerHTML=`<div class="records">${data.records.map(record=>{const s=record.score,c=s.classification,e=s.extraction,classification=!c.scored?'not scored':c.matched?'correct':'wrong';return `<details class="record"><summary><span><strong>${esc(record.filename)}</strong><span class="record-meta" style="display:block">Expected: ${value(c.expected)} · obtained: ${value(c.obtained)} · diagnostic: ${value(s.expected_diagnostic_type)} / ${value(s.obtained_diagnostic_type)}</span></span><span class="${c.matched?'ok':c.scored?'bad':'warn'}">${classification} · ${e.matched}/${e.total}</span></summary><div class="record-body">${record.error?`<div class="error">${esc(record.error)}</div>`:''}<table><thead><tr><th>Field</th><th>Expected</th><th>Obtained</th><th>Match</th></tr></thead><tbody>${e.fields.map(field=>`<tr><td>${esc(field.key)}</td><td>${value(field.expected)}</td><td>${value(field.obtained)}</td><td class="${field.matched?'ok':'bad'}">${field.matched?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div></details>`}).join('')}</div>`;
}
</script></body></html>
